<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5AB0FF"/><stop offset="1" stop-color="#0A63F2"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF3FB"/></linearGradient>
    <linearGradient id="ph" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD9A8"/><stop offset="1" stop-color="#FFC27A"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#002a6b" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <ellipse cx="512" cy="120" rx="520" ry="260" fill="#fff" opacity=".10"/>
  <!-- back card -->
  <g transform="rotate(-11 512 560)" filter="url(#sh)">
    <rect x="292" y="250" width="440" height="560" rx="56" fill="#CFE2FF"/>
  </g>
  <!-- front card -->
  <g transform="rotate(5 512 560)" filter="url(#sh)">
    <rect x="292" y="240" width="440" height="580" rx="56" fill="url(#card)"/>
    <rect x="332" y="280" width="360" height="330" rx="34" fill="url(#ph)"/>
    <circle cx="512" cy="420" r="78" fill="#7A4A2A"/>
    <circle cx="512" cy="436" r="66" fill="#F2C59A"/>
    <path d="M446 412c10-52 122-58 132 0-30-20-100-20-132 0z" fill="#7A4A2A"/>
    <path d="M392 610c0-74 54-112 120-112s120 38 120 112z" fill="#2F7BF0"/>
    <rect x="362" y="656" width="300" height="40" rx="20" fill="#1D1D1F"/>
    <rect x="402" y="726" width="220" height="28" rx="14" fill="#B7C3D6"/>
  </g>
  <!-- check badge -->
  <circle cx="742" cy="772" r="104" fill="#34C759" stroke="#fff" stroke-width="22"/>
  <path d="M694 774l34 34 66-72" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
